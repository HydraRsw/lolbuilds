<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LoLBuilds · TFT overlay</title>
<link rel="stylesheet" href="app.css">
<style>
  html,body{background:#0d0f14;overflow-x:hidden}
  body{overflow-y:auto;font-size:13px}
  .ov-top{position:sticky;top:0;z-index:20;background:rgba(13,15,20,.97);border-bottom:1px solid var(--line);padding:8px 10px 0}
  .ov-tabs{display:flex;gap:2px}
  .ov-tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);padding:8px 4px;font-weight:650;cursor:pointer}
  .ov-tabs button.on{color:var(--text);border-bottom-color:var(--gold)}
  .ov-hint{font-size:10.5px;color:var(--dim);display:flex;justify-content:space-between;gap:6px;margin-bottom:6px}
  .ov-hint b{color:var(--gold);font-weight:600}
  #ov{padding:10px}
  .ov-tools{display:flex;gap:6px;margin-bottom:8px}
  .ov-tools input{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 9px;color:var(--text);outline:0}
  .chips{display:flex;gap:4px;margin-bottom:8px;flex-wrap:wrap}
  .chips button{background:var(--card);border:1px solid var(--line);color:var(--muted);border-radius:7px;padding:4px 9px;font-weight:700;cursor:pointer;font-size:12px}
  .chips button.on{color:var(--text);border-color:var(--gold)}
  .oc{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden}
  .oc.pinned{border-color:var(--gold);box-shadow:0 0 0 1px rgba(232,178,58,.25)}
  .oc-h{display:flex;align-items:center;gap:8px;padding:8px 9px 4px;cursor:pointer}
  .oc-h .tier{min-width:26px;height:22px}
  .oc-h .nm{flex:1;min-width:0;font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .oc-h .st{font-size:11px;color:var(--muted);text-align:right;white-space:nowrap}
  .oc-h .st b{color:var(--text)}
  .oc-u{display:flex;flex-wrap:wrap;gap:6px 1px;padding:6px 8px 8px;cursor:pointer}
  .oc-u .tu{width:41px}
  .oc-u .tu-img{width:34px;height:34px;border-radius:7px}
  .oc-u .tu-name{display:none}
  .oc-b{border-top:1px solid var(--line);padding:9px}
  .oc-b h5{margin:10px 0 6px;font-size:11.5px;color:var(--muted);font-weight:650;text-transform:uppercase;letter-spacing:.3px}
  .oc-b h5:first-child{margin-top:0}
  .mini-board{height:205px;overflow:hidden}
  .mini-board .board{transform:scale(.72);transform-origin:top left}
  .stg{display:flex;gap:3px;margin-bottom:6px}
  .stg button{flex:1;background:var(--bg2);border:1px solid var(--line);border-radius:6px;color:var(--muted);font-size:11.5px;padding:4px;cursor:pointer}
  .stg button.on{color:var(--text);border-color:var(--line2);background:var(--card2)}
  .ci{display:flex;align-items:center;gap:6px;padding:4px 0}
  .ci .ti{width:24px;height:24px}
  .ci .rec{display:flex;align-items:center;gap:2px;margin-left:auto;opacity:.9}
  .ci .rec .ti{width:18px;height:18px}
  .oc-actions{display:flex;gap:6px;margin-top:8px}
  .comp-pick{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:6px}
  .cp{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 2px;cursor:pointer;user-select:none}
  .cp.has{border-color:var(--gold);background:rgba(232,178,58,.08)}
  .cp img{width:30px;height:30px;border-radius:6px}
  .cp b{position:absolute;top:2px;right:4px;font-size:11px;color:var(--gold)}
  .cp span{font-size:9.5px;color:var(--muted);text-align:center;line-height:1.1;max-width:62px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .craft{display:flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 8px;margin-bottom:5px}
  .craft.need{border-color:var(--gold)}
  .craft .grow{flex:1;min-width:0}
  .craft .grow b{display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .craft .grow small{color:var(--muted);font-size:10.5px}
  .craft .users{display:flex;gap:1px}
  .craft .users .tu-img{width:20px;height:20px;border-radius:4px;border-width:1px}
  .tag{font-size:9.5px;font-weight:800;color:#111;background:var(--gold);border-radius:4px;padding:1px 4px;margin-left:4px;vertical-align:1px}
  .sec{font-size:11.5px;color:var(--muted);font-weight:650;text-transform:uppercase;letter-spacing:.3px;margin:12px 0 6px;display:flex;align-items:center;justify-content:space-between}
  .sec a{color:var(--dim);text-transform:none;font-weight:500;cursor:pointer}
  table.recipes th,table.recipes td{padding:2px}
  table.recipes .ti{width:22px;height:22px}
  .ct-badge{display:none;font-size:10.5px;color:#111;background:var(--teal);border-radius:4px;padding:1px 5px;font-weight:700}
  body.clickthru .ct-badge{display:inline}
  .empty{color:var(--dim);font-size:12px;padding:6px 0}
</style>
</head>
<body>
<div class="ov-top">
  <div class="ov-hint"><span><b>Ctrl+Shift+X</b> ocultar · <b>Ctrl+Shift+Z</b> atravesar clics</span><span class="ct-badge">Clics atraviesan</span></div>
  <div class="ov-tabs" id="ovTabs"><button data-t="comps" class="on">Composiciones</button><button data-t="items">Objetos</button><button data-t="recipes">Recetas</button></div>
</div>
<div id="ov"><div class="inline-load"><div class="spinner"></div>Cargando…</div></div>
<div class="tooltip" id="tooltip"></div>
<div class="toast" id="toast"></div>
<script>
'use strict';
/* Minimal shim of the helpers tft.js expects from app.js */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pct = (x, d = 1) => (x == null || isNaN(x)) ? '—' : (x * 100).toFixed(d) + '%';
const fmt = n => n == null ? '—' : Number(n).toLocaleString('es');
const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]/g, '');
const S = { freshUntil: 0 };
const memo = new Map();
function api(url) {
  if (memo.has(url)) return memo.get(url);
  const p = fetch('/p?u=' + encodeURIComponent(url)).then(async r => { const j = await r.json(); if (!r.ok) throw new Error(j.error || 'HTTP ' + r.status); return j; });
  memo.set(url, p); p.catch(() => memo.delete(url)); return p;
}
function ph(alt) {
  const t = (alt || '?').slice(0, 2).toUpperCase();
  return 'data:image/svg+xml,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64"><rect width="64" height="64" fill="#1e222c"/><text x="32" y="40" font-family="Segoe UI,sans-serif" font-size="22" font-weight="700" fill="#636a7b" text-anchor="middle">${t}</text></svg>`);
}
document.addEventListener('error', e => {
  const el = e.target;
  if (el.tagName !== 'IMG' || el.dataset.failed) return;
  if (el.dataset.fb) { const fb = el.dataset.fb; delete el.dataset.fb; el.src = fb; return; }
  el.dataset.failed = 1; el.src = ph(el.alt);
}, true);
const view = document.getElementById('ov');
let routeToken = 0;
const stale = () => false;
const loadingHTML = (m = 'Cargando…') => `<div class="inline-load"><div class="spinner"></div>${esc(m)}</div>`;
const errorBox = e => `<div class="error-box">${esc(e?.message || e)}</div>`;
const go = h => { if (h.startsWith('#/tft/comp/')) { ovOpenComp(h.split('/').pop()); } };
let toastT;
function toast(msg, err) { const t = $('#toast'); t.textContent = msg; t.className = 'toast show' + (err ? ' err' : ''); clearTimeout(toastT); toastT = setTimeout(() => t.className = 'toast', 2500); }
const tip = $('#tooltip');
document.addEventListener('mouseover', e => {
  const t = e.target.closest('[data-tip]');
  if (!t) { tip.classList.remove('show'); return; }
  const [kind, id] = [t.dataset.tip.slice(0, t.dataset.tip.indexOf(':')), t.dataset.tip.slice(t.dataset.tip.indexOf(':') + 1)];
  const h = kind.startsWith('tft-') ? tftTip(kind.slice(4), decodeURIComponent(id)) : kind === 'text' ? esc(decodeURIComponent(id)) : '';
  if (!h) return; tip.innerHTML = h; tip.classList.add('show');
});
document.addEventListener('mousemove', e => {
  if (!tip.classList.contains('show')) return;
  const w = tip.offsetWidth, h = tip.offsetHeight;
  let x = e.clientX + 14, y = e.clientY + 14;
  if (x + w > innerWidth - 6) x = Math.max(6, e.clientX - w - 10);
  if (y + h > innerHeight - 6) y = Math.max(6, e.clientY - h - 10);
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
});
// In the overlay, links should not navigate away.
document.addEventListener('click', e => { const a = e.target.closest('a[href^="#/"]'); if (a) e.preventDefault(); }, true);
window.onClickThrough = on => document.body.classList.toggle('clickthru', on);
</script>
<script src="tft.js"></script>
<script src="overlay.js"></script>
</body>
</html>
